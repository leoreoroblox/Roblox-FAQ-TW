<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox 問答網</title>
    <style>
        body { margin: 0; font-family: sans-serif; }
        /* 載入畫面的箱子 */
        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0b0f19; color: #00ffcc; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
        /* 三個點的閃爍魔法 */
        .dot { animation: blink 1.4s infinite both; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; } }
        /* 進度條的外觀 */
        .progress-container { width: 80%; background: #1a2332; border: 1px solid #00ffcc; border-radius: 5px; height: 30px; overflow: hidden; }
        #progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #00ffcc, #0055ff); transition: width 0.1s; }
        #percent-text { margin-top: 15px; font-size: 24px; font-family: monospace; }
        /* 最後出現的標題 */
        h1 { color: #0055ff; text-align: center; margin-top: 50px; }
    </style>
</head>
<body>

    <!-- 加載畫面 -->
    <div id="loader">
        <div style="font-size: 20px; margin-bottom: 20px; font-family: monospace;">Loading<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></div>
        <div class="progress-container">
            <div id="progress-bar"></div>
        </div>
        <div id="percent-text">0%</div>
    </div>

    <!-- 網站主要內容 -->
    <h1>歡迎使用roblox問答網</h1>

    <!-- 讓進度條跑起來的魔法 -->
    <script>
        let progress = 0;
        const interval = setInterval(() => {
            progress += 1;
            document.getElementById('progress-bar').style.width = progress + '%';
            document.getElementById('percent-text').innerText = progress + '%';
            if (progress >= 100) {
                clearInterval(interval);
                setTimeout(() => {
                    document.getElementById('loader').style.display = 'none';
                }, 500);
            }
        }, 30);
    </script>

</body>
</html>
