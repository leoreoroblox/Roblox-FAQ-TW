<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox 問答網</title>
    <style>
        body { margin: 0; font-family: sans-serif; }
        /* 載入畫面的箱子 */
        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0b0f19; color: #00ffcc; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
        /* 三個點的閃爍魔法 */
        .dot { animation: blink 1.4s infinite both; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; } }
        /* 進度條的外觀 */
        .progress-container { width: 80%; background: #1a2332; border: 1px solid #00ffcc; border-radius: 5px; height: 30px; overflow: hidden; }
        #progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #00ffcc, #0055ff); transition: width 0.1s; }
        #percent-text { margin-top: 15px; font-size: 24px; font-family: monospace; }
        /* 最後出現的標題 */
        h1 { color: #0055ff; text-align: center; margin-top: 50px; }
    </style>
</head>
<body>

    <!-- 加載畫面 -->
    <div id="loader">
        <div style="font-size: 20px; margin-bottom: 20px; font-family: monospace;">Loading<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></div>
        <div class="progress-container">
            <div id="progress-bar"></div>
        </div>
        <div id="percent-text">0%</div>
    </div>

    <!-- 網站主要內容 -->
    <h1>歡迎使用roblox問答網</h1>

    <!-- 讓進度條跑起來的魔法 -->
    <script>
        let progress = 0;
        const interval = setInterval(() => {
            progress += 1;
            document.getElementById('progress-bar').style.width = progress + '%';
            document.getElementById('percent-text').innerText = progress + '%';
            if (progress >= 100) {
                clearInterval(interval);
                setTimeout(() => {
                    document.getElementById('loader').style.display = 'none';
                }, 500);
            }
        }, 30);
    </script>

</body>
</html>
<div id="user-info" style="position: fixed; bottom: 20px; right: 20px; background: rgba(0, 0, 0, 0.8); color: #00ffcc; padding: 15px; border-radius: 10px; border: 1px solid #00ffcc; font-family: monospace; font-size: 14px; z-index: 10000; display: none; max-width: 250px; line-height: 1.5;">
    <span id="close-btn" style="position: absolute; top: 5px; right: 10px; cursor: pointer; color: #ff5555; font-weight: bold;">✖</span>
    <div style="margin-bottom: 5px;">📱 設備：<span id="device-type">偵測中...</span></div>
    <div style="margin-bottom: 5px;">🌍 地區：<span id="user-region">偵測中...</span></div>
    <div>🌐 IP：<span id="user-ip">偵測中...</span></div>
</div>

<script>
    // 1. 判斷是手機還是電腦
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    document.getElementById('device-type').innerText = isMobile ? '手機 (Mobile)' : '電腦 (PC)';

    // 2. 抓取使用者的 IP 和地區 (使用免費的 ipapi 服務)
    fetch('https://ipapi.co/json/')
        .then(response => response.json())
        .then(data => {
            document.getElementById('user-ip').innerText = data.ip || '無法取得';
            document.getElementById('user-region').innerText = (data.city || '未知') + ', ' + (data.country_name || '未知');
            // 資料抓到後，把卡片顯示出來
            document.getElementById('user-info').style.display = 'block';
        })
        .catch(() => {
            document.getElementById('user-ip').innerText = '讀取失敗';
            document.getElementById('user-region').innerText = '讀取失敗';
            document.getElementById('user-info').style.display = 'block';
        });

    // 3. 點擊叉叉可以關閉卡片
    document.getElementById('close-btn').addEventListener('click', () => {
        document.getElementById('user-info').style.display = 'none';
    });
</script>
