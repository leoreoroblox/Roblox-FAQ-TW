name: Roblox 自動化遊戲更新監控

on:
  schedule:
    # 每 6 小時執行一次 (避免抓取太頻繁被限制)
    - cron: '0 */6 * * *'
  workflow_dispatch: # 允許手動測試

jobs:
  check-update:
    runs-on: ubuntu-latest
    steps:
      - name: 簽出程式碼
        uses: actions/checkout@v3

      - name: 設定 Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: 自動抓取熱門遊戲並監控
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          npm install @supabase/supabase-js axios
          node -e "
            const { createClient } = require('@supabase/supabase-js');
            const axios = require('axios');
            const supabase = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_KEY);

            // 休息函式 (模擬排隊，避免被封 IP)
            const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

            async function fetchHotGames() {
              try {
                console.log('🔄 正在向 Roblox 抓取熱門遊戲排行榜...');
                // 抓取 Roblox 官方的「熱門趨勢」排行榜
                const sortsRes = await axios.get('https://games.roblox.com/v1/games/sorts?model.gameSortsContext=GamesDefaultSortsContext');
                
                // 找到「Top Trending (熱門趨勢)」的 Token
                const trendingSort = sortsRes.data.sorts.find(s => s.sortDisplayName === 'Top Trending') || sortsRes.data.sorts[0];
                
                // 抓取該排行榜前 15 名遊戲
                const listRes = await axios.get('https://games.roblox.com/v1/games/list?model.sortToken=' + trendingSort.token + '&model.maxRows=15');
                
                const gameIds = listRes.data.games.map(g => g.universeId.toString());
                console.log('✅ 成功抓到 ' + gameIds.length + ' 個熱門遊戲！');
                return gameIds;
              } catch (error) {
                console.error('❌ 抓取排行榜失敗:', error.message);
                return [];
              }
            }

            async function checkUpdates() {
              // 1. 先拿到熱門遊戲名單
              const gameIds = await fetchHotGames();
              if (gameIds.length === 0) return;

              // 2. 分批處理 (一次處理一個，中間休息 1.5 秒)
              for (const universeId of gameIds) {
                try {
                  console.log('正在檢查 Universe ID: ' + universeId);
                  
                  // 抓取遊戲詳情
                  const gameRes = await axios.get('https://games.roblox.com/v1/games?universeIds=' + universeId);
                  const game = gameRes.data.data[0];
                  if (!game) continue;

                  const gameUpdated = game.updated;
                  const placeId = game.rootPlaceId.toString(); 

                  // 檢查資料庫有沒有這個遊戲的紀錄
                  const { data: existing } = await supabase
                    .from('game_updates')
                    .select('updated_date')
                    .eq('game_id', placeId)
                    .order('created_at', { ascending: false })
                    .limit(1);

                  if (existing && existing.length > 0 && existing[0].updated_date === gameUpdated) {
                    console.log('[' + game.name + '] 沒更新，跳過。');
                  } else {
                    // 寫入新紀錄
                    const { error } = await supabase.from('game_updates').insert([{
                      game_id: placeId,
                      game_name: game.name,
                      creator_name: game.creator.name,
                      updated_date: gameUpdated,
                      playing: game.playing
                    }]);

                    if (error) { console.error('[' + game.name + '] 寫入失敗:', error); } 
                    else { console.log('✅ [' + game.name + '] 發現更新！已寫入資料庫。'); }
                  }
                  
                  // ⚠️ 關鍵的分批處理：每次查詢後休息 1500 毫秒 (1.5 秒)
                  await sleep(1500);

                } catch (err) {
                  console.error('檢查 Universe ID ' + universeId + ' 時發生錯誤:', err.message);
                }
              }
            }
            checkUpdates();
          "
