name: Roblox 遊戲更新監控機器人

on:
  schedule:
    # 每小時的第 0 分鐘執行一次
    - cron: '0 * * * *'
  workflow_dispatch: # 允許手動點擊測試

jobs:
  check-update:
    runs-on: ubuntu-latest
    steps:
      - name: 簽出程式碼
        uses: actions/checkout@v3

      - name: 設定 Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: 安裝依賴並執行多遊戲監控
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          npm install @supabase/supabase-js axios
          node -e "
            const { createClient } = require('@supabase/supabase-js');
            const axios = require('axios');
            const supabase = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_KEY);

            // 👇 這裡填寫你想監控的遊戲 Place ID，可以無限增加！
            const gameIds = [
              '6516141723', // DOORS
              '920587237'   // Adopt Me (你可以自己換成其他遊戲)
            ];

            async function checkUpdates() {
              for (const placeId of gameIds) {
                try {
                  console.log('正在檢查遊戲 ID: ' + placeId);
                  
                  // 1. 取得遊戲的 Universe ID
                  const uniRes = await axios.get('https://apis.roblox.com/universes/v1/places/' + placeId + '/universe');
                  const universeId = uniRes.data.universeId;
                  
                  // 2. 抓取遊戲最新資訊
                  const gameRes = await axios.get('https://games.roblox.com/v1/games?universeIds=' + universeId);
                  const game = gameRes.data.data[0];
                  if (!game) continue;

                  const gameUpdated = game.updated; // 這是一串 ISO 時間

                  // 3. 去資料庫查這個遊戲有沒有紀錄，比對最後更新時間是否一樣
                  const { data: existing } = await supabase
                    .from('game_updates')
                    .select('updated_date')
                    .eq('game_id', placeId)
                    .order('created_at', { ascending: false })
                    .limit(1);

                  if (existing && existing.length > 0 && existing[0].updated_date === gameUpdated) {
                    console.log('[' + game.name + '] 沒有更新，跳過。');
                    continue; // 沒更新就換下一個遊戲
                  }

                  // 4. 有更新！寫入新的紀錄到資料庫
                  const { error } = await supabase.from('game_updates').insert([{
                    game_id: placeId,
                    game_name: game.name,
                    creator_name: game.creator.name,
                    updated_date: gameUpdated,
                    playing: game.playing
                  }]);

                  if (error) { console.error('[' + game.name + '] 寫入失敗:', error); } 
                  else { console.log('✅ [' + game.name + '] 發現更新！已成功記錄。'); }
                  
                } catch (err) {
                  console.error('檢查遊戲 ' + placeId + ' 時發生錯誤:', err.message);
                }
              }
            }
            checkUpdates();
          "
